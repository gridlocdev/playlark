# Every push and pull request: format, lint, types, unit tests and the build (`pnpm check`), then the browser
# scenarios in headless Chromium. The desktop scenarios need Electron and run locally with `just e2e-desktop`.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c e2e/playwright.config.ts --project=web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: .e2e-results/
          retention-days: 7
