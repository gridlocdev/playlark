appId: dev.gridloc.playlark
productName: Playlark
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
# Electron fuses, flipped before signing (scripts/fuses.mjs).
afterPack: scripts/fuses.mjs
# One naming scheme on every system: Playlark-1.0.0-mac-arm64.dmg, Playlark-1.0.0-win-x64.exe, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.music
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  icon: build/icon.png
  target: [AppImage]
  # The package name (@playlark/desktop) isn't a usable file name.
  executableName: playlark
  category: Audio
win:
  icon: build/icon.ico
  target: [nsis]
